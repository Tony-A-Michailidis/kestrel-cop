# Kestrel COP configuration. Secrets come from the environment: ${VAR} is expanded at load time.
area:
  name: Hampton Roads / Chesapeake approaches
  center: [36.95, -76.30]      # lat, lon
  radius_nm: 150

feeds:
  adsb:
    enabled: true
    provider: adsblol          # adsblol (no key) | opensky | url (your own readsb/dump1090 aircraft.json)
    # url: http://192.168.1.50/tar1090/data/aircraft.json
    poll_seconds: 10
  ais:
    enabled: true
    api_key: ${AISSTREAM_API_KEY}   # free key from https://aisstream.io
  nws:
    enabled: true
    areas: [VA, MD, NC]
    poll_seconds: 180
  firms:
    enabled: false
    map_key: ${FIRMS_MAP_KEY}       # free key from https://firms.modaps.eosdis.nasa.gov/api/map_key/
    product: VIIRS_SNPP_NRT
    poll_seconds: 900
  usgs:
    enabled: true
    poll_seconds: 180
    min_magnitude: 2.5
    global_min_magnitude: 5.5
  cameras:
    enabled: true                 # open traffic cameras as still images; only cameras inside the area are kept
    poll_seconds: 900
    drivebc: true                 # British Columbia, no key
    caltrans: true                # California, no key (all 12 districts)
    toronto: true                 # City of Toronto open data, no key
    ottawa: true                  # City of Ottawa and MTO cameras, no key
    wsdot_access_code: ${WSDOT_ACCESS_CODE}   # Washington State: free code from https://wsdot.wa.gov/traffic/api/
    cars:                         # 511 sites on the CARS platform: free developer key per site at <host>/developers
      - { name: ontario, host: https://511on.ca, key: ${ONTARIO_511_KEY} }
      - { name: alberta, host: https://511.alberta.ca, key: ${ALBERTA_511_KEY} }
      - { name: wisconsin, host: https://511wi.gov, key: ${WI_511_KEY} }
      - { name: georgia, host: https://511ga.org, key: ${GA_511_KEY} }
      - { name: arizona, host: https://az511.gov, key: ${AZ_511_KEY} }

tak:
  enabled: false
  url: tcp://127.0.0.1:8087        # TAK Server: tls://host:8089 with the certs below
  # tls_client_cert: certs/kestrel.pem
  # tls_client_key: certs/kestrel.key
  # tls_dont_verify: true
  publish_alerts: true
  publish_cameras: false           # traffic cameras as markers in ATAK (many; off by default)

rules:
  stale_feed_seconds: 120
  ais_gap_minutes: 10
  quake_alert_magnitude: 4.0
  zones:
    - name: ROZ ALPHA
      type: circle
      center: [36.85, -75.70]
      radius_km: 18
      severity: MEDIUM

ai:
  enabled: true
  model: claude-sonnet-5-5         # ANTHROPIC_API_KEY in the environment; without it Kestrel runs the mock watch officer
  triage_model: claude-haiku-4-5-20251001   # cheaper model for alert SPOTREPs (optional)
  auto_sitrep: true
  sitrep_every_minutes: 10
  triage_alerts: true

web:
  host: 127.0.0.1
  port: 8000
  # basemap_style: http://tileserver.local/styles/dark/style.json   # for offline / air-gapped use
